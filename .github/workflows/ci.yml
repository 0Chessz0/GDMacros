# Runs on every push and pull request.
#
# The point is macro submissions: a bad entry in data/macros.json (missing field,
# wrong recorder, duplicate URL, broken JSON) fails here instead of breaking the
# Vercel deploy after merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate data/macros.json
        run: npm run validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
