# Optional GitHub Pages deploy.
#
# You do NOT need this if you deploy with Vercel, which builds straight from the
# repo on every push. This workflow is manual-only (Actions tab -> Run workflow) so
# it never runs, and never fails, unless you deliberately ask for it.
#
# To use it: Settings -> Pages -> Source: "GitHub Actions", then run it once.
# NEXT_BASE_PATH must match the repo name when serving from <user>.github.io/<repo>.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_OUTPUT: export
      NEXT_BASE_PATH: /GDMacros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate macro metadata
        run: npm run validate

      - run: npm run build

      # Stops GitHub Pages from running Jekyll over the export.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
