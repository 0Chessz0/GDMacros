name: Macro submission
description: Submit a macro to be added to the catalog
title: "[Macro] "
labels: ["macro submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting! You don't need to upload the file anywhere yourself.
        Attach it below and we'll host it and add the entry.

        Only macros recorded with **Mega Hack** or **xdBot** are accepted, and reuploads
        of other people's macros are not posted.
        See the [guidelines](https://github.com/0Chessz0/GDMacros#adding-a-macro).

  - type: input
    id: level
    attributes:
      label: Level name
      placeholder: Society
    validations:
      required: true

  - type: input
    id: creator
    attributes:
      label: Level creator
      description: Who built the level in-game. Not you, unless you made it.
      placeholder: Neomarbilan
    validations:
      required: true

  - type: input
    id: macro-author
    attributes:
      label: Macro author
      description: Who recorded the macro. This should be you.
      placeholder: wPopoff
    validations:
      required: true

  - type: input
    id: level-id
    attributes:
      label: Level ID
      description: The in-game level ID. Check it resolves at https://gdbrowser.com/<id>
      placeholder: "127323087"
    validations:
      required: true

  - type: dropdown
    id: recorder
    attributes:
      label: Recorded with
      options:
        - Mega Hack
        - xdBot
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: Macro file
      description: Drag and drop the macro file into this box to attach it.
      placeholder: Drop the file here...
    validations:
      required: true

  - type: input
    id: video
    attributes:
      label: Showcase video (optional)
      description: A YouTube link. If you provide one it becomes the entry's thumbnail.
      placeholder: https://www.youtube.com/watch?v=...

  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      placeholder: Playback notes, settings needed, etc.

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This macro is my own work and is not a reupload.
          required: true
        - label: It was recorded with Mega Hack or xdBot.
          required: true
